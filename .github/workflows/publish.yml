name: Poor Dave publisher

on:
  schedule:
    - cron: '7,27,47 * * * *'   # every 20 minutes; the queue decides what is due
  workflow_dispatch:
    inputs:
      mode:
        description: 'run, or auth'
        default: 'run'
        required: true
      platform:
        description: 'for auth: tiktok or youtube'
        default: ''
        required: false
      code:
        description: 'for auth: one-time authorization code from callback.html'
        default: ''
        required: false

permissions:
  contents: write

concurrency:
  group: publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt tokens
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: |
          mkdir -p state
          if [ -f state/tokens.enc ] && [ -n "$TOKEN_KEY" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in state/tokens.enc -out state/tokens.json -pass env:TOKEN_KEY
          fi

      - name: Publish due items
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'run' }}
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: python3 scripts/publish.py run

      - name: Connect account
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'auth' }}
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CODE: ${{ inputs.code }}
          PLATFORM: ${{ inputs.platform }}
        run: python3 scripts/publish.py auth "$PLATFORM" "$CODE"

      - name: Encrypt tokens and save queue
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: |
          if [ -f state/tokens.json ] && [ -n "$TOKEN_KEY" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in state/tokens.json -out state/tokens.enc -pass env:TOKEN_KEY
          fi
          rm -f state/tokens.json
          git config user.name "poor-dave-bot"
          git config user.email "poor-dave-bot@users.noreply.github.com"
          git add queue.json state/tokens.enc 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "publisher: update queue/tokens [skip ci]" && git push)
